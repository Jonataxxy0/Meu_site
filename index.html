```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lobby de Terror</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #252525 0%, #0b0b0b 60%, #000 100%);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Ambiente */

.lobby {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

h1 {
    position: absolute;
    top: 45px;
    font-size: 42px;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #ff0000;
}

.subtitle {
    position: absolute;
    top: 100px;
    color: #999;
}

/* Plataformas */

.platforms {
    display: flex;
    gap: 50px;
    align-items: center;
    justify-content: center;
    margin-top: 80px;
}

.platform {
    width: 220px;
    height: 150px;
    background: linear-gradient(145deg, #252525, #090909);
    border: 2px solid #555;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 15px 30px rgba(0,0,0,0.8);
}

.platform:hover {
    transform: translateY(-8px);
    border-color: #ff2222;
    box-shadow: 0 0 25px rgba(255,0,0,0.4);
}

.platform h2 {
    font-size: 22px;
    margin-bottom: 15px;
}

.players {
    font-size: 28px;
    font-weight: bold;
    color: #00ff88;
}

.status {
    margin-top: 8px;
    font-size: 14px;
    color: #aaa;
}

/* Contagem */

.countdown {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.9);
    border: 1px solid #ff2222;
    border-radius: 10px;
    padding: 15px 25px;
    display: none;
    text-align: center;
    box-shadow: 0 0 20px rgba(255,0,0,0.4);
}

.countdown span {
    display: block;
    font-size: 35px;
    color: #ff2222;
    font-weight: bold;
}

/* Mensagem */

.message {
    position: fixed;
    bottom: 35px;
    background: rgba(0,0,0,0.8);
    padding: 15px 30px;
    border-radius: 10px;
    color: #ccc;
}

/* Jogador */

.player {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: #151515;
    border: 1px solid #333;
    padding: 10px 20px;
    border-radius: 8px;
}

.player strong {
    color: #00ff88;
}
</style>
</head>

<body>

<div class="lobby">

    <h1>LOBBY</h1>

    <p class="subtitle">
        Escolha uma plataforma para entrar no matchmaking
    </p>

    <div class="platforms">

        <div class="platform" onclick="entrarFila(1)">
            <h2>SOLO</h2>
            <div class="players" id="players1">0/1</div>
            <div class="status" id="status1">Clique para entrar</div>
        </div>

        <div class="platform" onclick="entrarFila(2)">
            <h2>2 JOGADORES</h2>
            <div class="players" id="players2">0/2</div>
            <div class="status" id="status2">Clique para entrar</div>
        </div>

        <div class="platform" onclick="entrarFila(4)">
            <h2>4 JOGADORES</h2>
            <div class="players" id="players4">0/4</div>
            <div class="status" id="status4">Clique para entrar</div>
        </div>

    </div>

    <div class="player">
        Jogador atual: <strong>Você</strong>
    </div>

    <div class="message" id="message">
        Clique em uma plataforma para entrar na fila.
    </div>

</div>

<div class="countdown" id="countdown">
    INICIANDO EM
    <span id="timer">10</span>
</div>


<script>

let filas = {
    1: {
        jogadores: 0,
        max: 1,
        contador: null,
        tempo: 10
    },

    2: {
        jogadores: 0,
        max: 2,
        contador: null,
        tempo: 10
    },

    4: {
        jogadores: 0,
        max: 4,
        contador: null,
        tempo: 10
    }
};

let filaAtual = null;


/* Entrar em uma fila */

function entrarFila(maxJogadores) {

    // Impede o jogador de entrar em duas filas
    if (filaAtual !== null) {

        if (filaAtual === maxJogadores) {
            sairFila();
        } else {
            mostrarMensagem(
                "Você já está em outra fila!"
            );
        }

        return;
    }

    let fila = filas[maxJogadores];

    if (fila.jogadores >= fila.max) {
        mostrarMensagem(
            "Essa fila está cheia!"
        );
        return;
    }

    fila.jogadores++;

    filaAtual = maxJogadores;

    atualizarInterface(maxJogadores);

    mostrarMensagem(
        "Você entrou na fila de " +
        maxJogadores +
        " jogador(es)."
    );

    verificarFila(maxJogadores);
}


/* Sair da fila */

function sairFila() {

    if (filaAtual === null) {
        return;
    }

    let fila = filas[filaAtual];

    fila.jogadores--;

    if (fila.jogadores < 0) {
        fila.jogadores = 0;
    }

    // Cancela contagem se necessário
    if (fila.contador !== null) {

        clearInterval(fila.contador);

        fila.contador = null;
        fila.tempo = 10;

        document.getElementById("countdown").style.display = "none";

        mostrarMensagem(
            "Contagem cancelada. Jogadores insuficientes."
        );
    }

    atualizarInterface(filaAtual);

    filaAtual = null;
}


/* Verificar se a fila está cheia */

function verificarFila(maxJogadores) {

    let fila = filas[maxJogadores];

    if (fila.jogadores >= fila.max) {

        iniciarContagem(maxJogadores);

    }

}


/* Iniciar contagem */

function iniciarContagem(maxJogadores) {

    let fila = filas[maxJogadores];

    if (fila.contador !== null) {
        return;
    }

    fila.tempo = 10;

    let countdownBox =
        document.getElementById("countdown");

    let timer =
        document.getElementById("timer");

    countdownBox.style.display = "block";

    timer.textContent = fila.tempo;

    mostrarMensagem(
        "Fila completa! Preparando partida..."
    );

    fila.contador = setInterval(() => {

        // Se a fila ficar abaixo do máximo
        if (fila.jogadores < fila.max) {

            clearInterval(fila.contador);

            fila.contador = null;
            fila.tempo = 10;

            countdownBox.style.display = "none";

            atualizarInterface(maxJogadores);

            mostrarMensagem(
                "Contagem cancelada."
            );

            return;
        }

        fila.tempo--;

        timer.textContent = fila.tempo;

        if (fila.tempo <= 0) {

            clearInterval(fila.contador);

            fila.contador = null;

            countdownBox.style.display = "none";

            iniciarJogo(maxJogadores);

        }

    }, 1000);
}


/* Iniciar partida */

function iniciarJogo(maxJogadores) {

    let fila = filas[maxJogadores];

    mostrarMensagem(
        "PARTIDA INICIADA! " +
        fila.jogadores +
        " jogador(es) foram enviados para o mapa."
    );

    // Simulação de teleporte
    setTimeout(() => {

        fila.jogadores = 0;

        if (filaAtual === maxJogadores) {
            filaAtual = null;
        }

        atualizarInterface(maxJogadores);

        mostrarMensagem(
            "Você chegou ao mapa principal do jogo!"
        );

    }, 3000);
}


/* Atualizar interface */

function atualizarInterface(maxJogadores) {

    let fila = filas[maxJogadores];

    document.getElementById(
        "players" + maxJogadores
    ).textContent =
        fila.jogadores +
        "/" +
        fila.max;

    if (fila.jogadores >= fila.max) {

        document.getElementById(
            "status" + maxJogadores
        ).textContent =
            "Fila cheia!";

    } else {

        document.getElementById(
            "status" + maxJogadores
        ).textContent =
            "Clique para entrar";

    }
}


/* Mensagem */

function mostrarMensagem(texto) {

    document.getElementById(
        "message"
    ).textContent = texto;

}

</script>

</body>
</html>
